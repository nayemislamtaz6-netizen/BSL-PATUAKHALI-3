package com.example.memberapp;

import android.content.Intent;
import android.net.Uri;
import android.os.Bundle;
import android.widget.ImageButton;
import androidx.appcompat.app.AppCompatActivity;
import androidx.recyclerview.widget.LinearLayoutManager;
import androidx.recyclerview.widget.RecyclerView;
import com.google.firebase.database.DataSnapshot;
import com.google.firebase.database.DatabaseError;
import com.google.firebase.database.DatabaseReference;
import com.google.firebase.database.FirebaseDatabase;
import com.google.firebase.database.ValueEventListener;
import java.util.ArrayList;
import java.util.List;

public class MainActivity extends AppCompatActivity {
    private RecyclerView recyclerView;
    private MemberAdapter adapter;
    private List<Member> memberList;
    private DatabaseReference dbRef;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);

        recyclerView = findViewById(R.id.recyclerView);
        recyclerView.setLayoutManager(new LinearLayoutManager(this));
        memberList = new ArrayList<>();
        
        // false = সাধারণ ইউজার ভিউ (বাটন হাইড থাকবে)
        adapter = new MemberAdapter(this, memberList, false); 
        recyclerView.setAdapter(adapter);

        dbRef = FirebaseDatabase.getInstance().getReference("Members");

        // শুধুমাত্র Accepted স্ট্যাটাসের সদস্যদের ফিল্টার করে দেখানোর লজিক
        dbRef.addValueEventListener(new ValueEventListener() {
            @Override
            public void onDataChange(DataSnapshot snapshot) {
                memberList.clear();
                for (DataSnapshot data : snapshot.getChildren()) {
                    Member member = data.getValue(Member.class);
                    if (member != null && "Accepted".equals(member.status)) {
                        memberList.add(member);
                    }
                }
                adapter.notifyDataSetChanged();
            }

            @Override
            public void onCancelled(DatabaseError error) {}
        });

        // রেজিস্ট্রেশন পেজে যাওয়ার অ্যাকশন
        findViewById(R.id.btnRegister).setOnClickListener(v -> 
            startActivity(new Intent(MainActivity.this, RegisterActivity.class)));

        // এডমিন লগইন পেজে যাওয়ার অ্যাকশন
        findViewById(R.id.btnAdminLogin).setOnClickListener(v -> 
            startActivity(new Intent(MainActivity.this, LoginActivity.class)));

        // হোয়াটসঅ্যাপে যোগাযোগের অ্যাকশন
        ImageButton btnWhatsApp = findViewById(R.id.btnWhatsApp);
        btnWhatsApp.setOnClickListener(v -> {
            Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse("https://whatsapp.com"));
            startActivity(i);
        });
    }
}


