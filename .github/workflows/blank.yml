package com.example.memberapp;

import android.app.AlertDialog;
import android.content.Context;
import android.view.LayoutInflater;
import android.view.View;
import android.view.ViewGroup;
import android.widget.EditText;
import android.widget.LinearLayout;
import android.widget.TextView;
import android.widget.Button;
import androidx.annotation.NonNull;
import androidx.recyclerview.widget.RecyclerView;
import com.google.firebase.database.FirebaseDatabase;
import java.util.List;

public class MemberAdapter extends RecyclerView.Adapter<MemberAdapter.ViewHolder> {
    private Context context;
    private List<Member> list;
    private boolean isAdmin;

    public MemberAdapter(Context context, List<Member> list, boolean isAdmin) {
        this.context = context;
        this.list = list;
        this.isAdmin = isAdmin;
    }

    @NonNull
    @Override
    public ViewHolder onCreateViewHolder(@NonNull ViewGroup parent, int viewType) {
        View view = LayoutInflater.from(context).inflate(R.layout.item_member, parent, false);
        return new ViewHolder(view);
    }

    @Override
    public void onBindViewHolder(@NonNull ViewHolder holder, int position) {
        Member member = list[position];
        holder.tvName.setText(member.name);
        holder.tvMobile.setText("মোবাইল: " + member.mobile);
        holder.tvRole.setText("পদবি: " + member.role + " (" + member.status + ")");

        if (isAdmin) {
            holder.adminControlLayout.setVisibility(View.VISIBLE);
            
            // Accept Button
            holder.btnAccept.setOnClickListener(v -> 
                FirebaseDatabase.getInstance().getReference("Members").child(member.id).child("status").setValue("Accepted"));

            // Reject Button
            holder.btnReject.setOnClickListener(v -> 
                FirebaseDatabase.getInstance().getReference("Members").child(member.id).child("status").setValue("Rejected"));

            // Edit Name and Role Button
            holder.btnEdit.setOnClickListener(v -> showEditDialog(member));
        }
    }

    private void showEditDialog(Member member) {
        AlertDialog.Builder builder = new AlertDialog.Builder(context);
        builder.setTitle("তথ্য সংশোধন করুন");

        LinearLayout layout = new LinearLayout(context);
        layout.setOrientation(LinearLayout.VERTICAL);
        layout.setPadding(40, 20, 40, 20);

        final EditText etName = new EditText(context);
        etName.setText(member.name);
        layout.addView(etName);

        final EditText etRole = new EditText(context);
        etRole.setText(member.role);
        layout.addView(etRole);

        builder.setView(layout);

        builder.setPositiveButton("Update", (dialog, which) -> {
            String newName = etName.getText().toString();
            String newRole = etRole.getText().toString();
            FirebaseDatabase.getInstance().getReference("Members").child(member.id).child("name").setValue(newName);
            FirebaseDatabase.getInstance().getReference("Members").child(member.id).child("role").setValue(newRole);
        });
        builder.setNegativeButton("Cancel", null);
        builder.show();
    }

    @Override
    public int getItemCount() { return list.size(); }

    public static class ViewHolder extends RecyclerView.ViewHolder {
        TextView tvName, tvMobile, tvRole;
        LinearLayout adminControlLayout;
        Button btnAccept, btnReject, btnEdit;

        public ViewHolder(@NonNull View itemView) {
            super(itemView);
            tvName = itemView.findViewById(R.id.tvName);
            tvMobile = itemView.findViewById(R.id.tvMobile);
            tvRole = itemView.findViewById(R.id.tvRole);
            adminControlLayout = itemView.findViewById(R.id.adminControlLayout);
            btnAccept = itemView.findViewById(R.id.btnAccept);
            btnReject = itemView.findViewById(R.id.btnReject);
            btnEdit = itemView.findViewById(R.id.btnEdit);
        }
    }
}
package com.example.memberapp;

import android.os.Bundle;
import androidx.appcompat.app.AppCompatActivity;
import androidx.recyclerview.widget.LinearLayoutManager;
import androidx.recyclerview.widget.RecyclerView;
import com.google.firebase.database.*;
import java.util.ArrayList;
import java.util.List;

public class AdminDashboardActivity extends AppCompatActivity {
    private RecyclerView recyclerView;
    private MemberAdapter adapter;
    private List<Member> memberList;
    private DatabaseReference dbRef;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main); // একই মেইন লেআউট রিউজ করা হয়েছে

        // হোমপেজের বাটন হাইড বা টেক্সট চেঞ্জ করতে পারেন
        findViewById(R.id.btnAdminLogin).setVisibility(android.view.View.GONE);
        findViewById(R.id.bottomBar).setVisibility(android.view.View.GONE);

        recyclerView = findViewById(R.id.recyclerView);
        recyclerView.setLayoutManager(new LinearLayoutManager(this));
        memberList = new ArrayList<>();
        adapter = new MemberAdapter(this, memberList, true); // True = Admin মোড চালু
        recyclerView.setAdapter(adapter);

        dbRef = FirebaseDatabase.getInstance().getReference("Members");
        dbRef.addValueEventListener(new ValueEventListener() {
            @Override
            public void onDataChange(DataSnapshot snapshot) {
                memberList.clear();
                for (DataSnapshot data : snapshot.getChildren()) {
                    Member member = data.getValue(Member.class);
                    if (member != null) memberList.add(member);
                }
                adapter.notifyDataSetChanged();
            }
            @Override
            public void onCancelled(DatabaseError error) {}
        });
    }
}
# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
