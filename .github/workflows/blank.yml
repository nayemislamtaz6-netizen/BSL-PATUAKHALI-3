package com.example.memberapp;

import android.os.Bundle;
import android.widget.Button;
import android.widget.EditText;
import android.widget.Toast;
import androidx.appcompat.app.AppCompatActivity;
import com.google.firebase.database.DatabaseReference;
import com.google.firebase.database.FirebaseDatabase;

public class RegisterActivity extends AppCompatActivity {
    private EditText etName, etMobile;
    private DatabaseReference dbRef;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_register);

        etName = findViewById(R.id.etName);
        etMobile = findViewById(R.id.etMobile);
        dbRef = FirebaseDatabase.getInstance().getReference("Members");

        findViewById(R.id.btnSubmitReg).setOnClickListener(v -> {
            String name = etName.getText().toString().trim();
            String mobile = etMobile.getText().toString().trim();

            if (!name.isEmpty() && !mobile.isEmpty()) {
                String id = dbRef.push().getKey();
                // নতুন সদস্য ডিফল্টভাবে "Pending" এবং পদবি "সদস্য" থাকবে
                Member member = new Member(id, name, mobile, "সদস্য", "Pending");
                if (id != null) {
                    dbRef.child(id).setValue(member);
                    Toast.makeText(this, "আবেদন সফল! অ্যাডমিনের অনুমোদনের অপেক্ষা করুন।", Toast.LENGTH_LONG).show();
                    finish();
                }
            } else {
                Toast.makeText(this, "সব তথ্য পূরণ করুন", Toast.LENGTH_SHORT).show();
            }
        });

        // Back Button
        findViewById(R.id.btnBack).setOnClickListener(v -> finish());
    }
}
package com.example.memberapp;

import android.content.Intent;
import android.os.Bundle;
import android.widget.Button;
import android.widget.EditText;
import android.widget.Toast;
import androidx.appcompat.app.AppCompatActivity;

public class LoginActivity extends AppCompatActivity {
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_register); // একই লেআউট একটু পরিবর্তন করে ব্যবহার করতে পারেন

        EditText etUser = findViewById(R.id.etName);
        EditText etPass = findViewById(R.id.etMobile);
        Button btnLogin = findViewById(R.id.btnSubmitReg);

        etUser.setHint("অ্যাডমিন ইউজারনেম");
        etPass.setHint("পাসওয়ার্ড");
        etPass.setInputType(android.text.InputType.TYPE_TEXT_VARIATION_PASSWORD);
        btnLogin.setText("Login");

        btnLogin.setOnClickListener(v -> {
            if(etUser.getText().toString().equals("admin") && etPass.getText().toString().equals("admin123")) {
                startActivity(new Intent(LoginActivity.this, AdminDashboardActivity.class));
                finish();
            } else {
                Toast.makeText(this, "ভুল ইউজারনেম বা পাসওয়ার্ড!", Toast.LENGTH_SHORT).show();
            }
        });
        
        findViewById(R.id.btnBack).setOnClickListener(v -> finish());
    }
}
