            android:layout_height="wrap_content"
            android:src="@android:drawable/stat_notify_chat"
            android:backgroundTint="#25D366"
            android:contentDescription="WhatsApp" />
    </LinearLayout>
</RelativeLayout>
package com.example.memberapp;

import android.content.Intent;
import android.net.Uri;
import android.os.Bundle;
import android.widget.Button;
import android.widget.ImageButton;
import android.widget.Toast;
import androidx.appcompat.app.AppCompatActivity;
import androidx.recyclerview.widget.LinearLayoutManager;
import androidx.recyclerview.widget.RecyclerView;
import com.google.firebase.database.*;
import java.util.ArrayList;
import java.util.List;

public class MainActivity extends AppCompatActivity {
    private RecyclerView recyclerView;
    private MemberAdapter adapter;
    private List<Member> memberList;
    private DatabaseReference dbRef;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);

        recyclerView = findViewById(R.id.recyclerView);
        recyclerView.setLayoutManager(new LinearLayoutManager(this));
        memberList = new ArrayList<>();
        adapter = new MemberAdapter(this, memberList, false); // False = Admin মোড নয়
        recyclerView.setAdapter(adapter);

        dbRef = FirebaseDatabase.getInstance().getReference("Members");

        // ডাটা লোড করা (শুধুমাত্র Accepted সদস্যরা দেখাবে)
        dbRef.addValueEventListener(new ValueEventListener() {
            @Override
            public void onDataChange(DataSnapshot snapshot) {
                memberList.clear();
                for (DataSnapshot data : snapshot.getChildren()) {
                    Member member = data.getValue(Member.class);
                    if (member != null && "Accepted".equals(member.status)) {
                        memberList.add(member);
                    }
                }
                adapter.notifyDataSetChanged();
            }
            @Override
            public void onCancelled(DatabaseError error) {}
        });

        findViewById(R.id.btnRegister).setOnClickListener(v -> 
            startActivity(new Intent(MainActivity.this, RegisterActivity.class)));

        findViewById(R.id.btnAdminLogin).setOnClickListener(v -> 
            startActivity(new Intent(MainActivity.this, LoginActivity.class)));

        // WhatsApp Button Link
        ImageButton btnWhatsApp = findViewById(R.id.btnWhatsApp);
        btnWhatsApp.setOnClickListener(v -> {
            String url = "https://whatsapp.com";
            Intent i = new Intent(Intent.ACTION_VIEW);
            i.setData(Uri.parse(url));
            startActivity(i);
        });
    }
}
