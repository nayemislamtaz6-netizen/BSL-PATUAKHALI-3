package com.example.memberapp;

public class Member {
    public String id, name, mobile, role, status;

    public Member() {} // Firebase-এর জন্য খালি কনস্ট্রাক্টর প্রয়োজন

    public Member(String id, String name, String mobile, String role, String status) {
        this.id = id;
        this.name = name;
        this.mobile = mobile;
        this.role = role;
        this.status = status; // "Pending", "Accepted", "Rejected"
    }
}


// ============================================================================
// ২. MainActivity.java (Home Page Logic)
// PATH: app/src/main/java/com/example/memberapp/MainActivity.java
// ============================================================================
package com.example.memberapp;

import android.content.Intent;
import android.net.Uri;
import android.os.Bundle;
import android.widget.Button;
import android.widget.ImageButton;
import androidx.appcompat.app.AppCompatActivity;
import androidx.recyclerview.widget.LinearLayoutManager;
import androidx.recyclerview.widget.RecyclerView;
import com.google.firebase.database.*;
import java.util.ArrayList;
import java.util.List;

public class MainActivity extends AppCompatActivity {
    private RecyclerView recyclerView;
    private MemberAdapter adapter;
    private List<Member> memberList;
    private DatabaseReference dbRef;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);

        recyclerView = findViewById(R.id.recyclerView);
        recyclerView.setLayoutManager(new LinearLayoutManager(this));
        memberList = new ArrayList<>();
        adapter = new MemberAdapter(this, memberList, false); // False = সাধারণ ইউজার মোড
        recyclerView.setAdapter(adapter);

        dbRef = FirebaseDatabase.getInstance().getReference("Members");

        // শুধুমাত্র Approved/Accepted সদস্যদের হোমপেজে দেখাবে
        dbRef.addValueEventListener(new ValueEventListener() {
            @Override
            public void onDataChange(DataSnapshot snapshot) {
                memberList.clear();
                for (DataSnapshot data : snapshot.getChildren()) {
                    Member member = data.getValue(Member.class);
                    if (member != null && "Accepted".equals(member.status)) {
                        memberList.add(member);
                    }
                }
                adapter.notifyDataSetChanged();
            }
            @Override
            public void onCancelled(DatabaseError error) {}
        });

        // রেজিষ্ট্রেশন বাটনের কাজ
        findViewById(R.id.btnRegister).setOnClickListener(v -> 
            startActivity(new Intent(MainActivity.this, RegisterActivity.class)));

        // অ্যাডমিন লগইন বাটনের কাজ
        findViewById(R.id.btnAdminLogin).setOnClickListener(v -> 
            startActivity(new Intent(MainActivity.this, LoginActivity.class)));

        // হোয়াটসঅ্যাপ বাটন অ্যাকশন (০১৭৭১০৬ชม৪৯)
        ImageButton btnWhatsApp = findViewById(R.id.btnWhatsApp);
        btnWhatsApp.setOnClickListener(v -> {
            String url = "https://whatsapp.com";
            Intent i = new Intent(Intent.ACTION_VIEW);
            i.setData(Uri.parse(url));
            startActivity(i);
        });
    }
}


